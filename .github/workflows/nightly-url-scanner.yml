name: Nightly URL Scanner Round-Trip

on:
  schedule:
    # Run at 06:00 UTC every day (midnight EST / 1 AM EDT)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override the target URL (defaults to PRODUCTION_URL secret)"
        required: false
        default: ""

concurrency:
  group: nightly-url-scanner
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  url-scanner-round-trip:
    name: URL Scanner round-trip (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # PRODUCTION_URL must be set as a repository secret.
      # A workflow_dispatch input can override it for ad-hoc runs.
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || secrets.PRODUCTION_URL }}
      # Ensure the network test is not skipped.
      SKIP_NETWORK_TESTS: ""
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Run URL scanner round-trip test
        id: playwright
        run: ./node_modules/.bin/playwright test --config playwright.nightly.config.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-url-scanner-results-${{ github.run_id }}
          path: |
            nightly-results.json
            test-results/
          retention-days: 14

      - name: Open a failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split("T")[0];
            const title = `[Nightly] URL Scanner round-trip failed – ${today}`;

            // Avoid duplicate issues for the same day
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "nightly-regression",
              per_page: 10,
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: dup.number,
                body: `Another failure in the same day: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: [
                "## Nightly URL Scanner regression",
                "",
                `The scheduled round-trip test against the production URL failed on **${today}**.`,
                "",
                `**Workflow run:** ${runUrl}`,
                "",
                "### What to check",
                "- AI response format may have changed (Anthropic API update).",
                "- The production URL may be unreachable or returning an unexpected status.",
                "- The \`/api/tools/url-scanner\` backend route may have regressed.",
                "",
                "Download the **nightly-url-scanner-results** artifact from the run above for",
                "the full JSON report and any failure screenshots.",
              ].join("\n"),
              labels: ["nightly-regression", "bug"],
            });
